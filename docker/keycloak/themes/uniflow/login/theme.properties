# UniFlow login theme (Keycloak 26)
#
# parent=keycloak  — every page we do not override (WebAuthn, TOTP setup, IdP linking,
#                    terms, expired page, …) still works. This file only replaces PatternFly
#                    class names with our own, and loads our CSS instead of PatternFly.
# import=common/keycloak — WebAuthn / OTP helpers live in the shared vendor bundle.

parent=keycloak
import=common/keycloak

# Empty common styles so PatternFly is not injected. Our sheet is the only stylesheet.
stylesCommon=
styles=css/login.css

meta=viewport==width=device-width,initial-scale=1

# Brand link behind the wordmark. Leave blank to keep it non-navigating.
kcLogoLink=

kcHtmlClass=uf-html
kcBodyClass=uf-body
kcLoginClass=uf-page
