global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  # Optional local debug: the app binds Prometheus to loopback :8082 when profile=local.
  - job_name: uniflow-local
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets: ["host.docker.internal:8082"]
