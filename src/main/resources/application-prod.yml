# Production. Every value below must be supplied by the environment: the application fails to
# start rather than falling back to a default credential.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:40}
      minimum-idle: ${DB_POOL_MIN:10}

  jpa:
    properties:
      hibernate:
        format_sql: false

  flyway:
    # Never destructive in production; migrations are forward-only.
    clean-disabled: true

  # No defaults on purpose. An application that falls back to a development issuer would accept
  # tokens minted by a throwaway Keycloak — failing to start is the safer outcome.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}

logging:
  level:
    root: WARN
    com.university.lms: INFO
    org.hibernate.SQL: WARN

# No defaults, deliberately. A production instance that fell back to a development issuer would
# accept tokens minted by a throwaway identity provider; failing to start is the safer outcome.
# The client secret is administrative access to every identity in the realm — it comes from the
# environment or a secret store, never from a file, and never appears in a log or an error body.
lms:
  identity:
    keycloak:
      enabled: ${KEYCLOAK_ADMIN_ENABLED:true}
      base-url: ${KEYCLOAK_BASE_URL}
      realm: ${KEYCLOAK_REALM}
      client-id: ${KEYCLOAK_ADMIN_CLIENT_ID}
      client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}

# Telemetry leaves only over OTLP. Unset endpoints fail start-up — never silently target localhost.
management:
  prometheus:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT}
    metrics:
      export:
        enabled: true
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT}
