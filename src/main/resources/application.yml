# Base configuration shared by every profile.
# Environment-specific datasource / secret wiring lives in the profile files; nothing secret
# is ever committed here.
spring:
  application:
    name: university-lms

  profiles:
    default: local

  # Redis is optional (multi-node SSE only). Without this exclusion, Boot auto-configures a
  # Lettuce client and the health indicator probes localhost:6379 even when
  # lms.notifications.sse.provider=local.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  jpa:
    # The schema is owned by Flyway. Hibernate only ever checks that the mapping and the migrated
    # schema agree, and refuses to start when they have drifted.
    hibernate:
      ddl-auto: validate
    # Off deliberately: an open session in the view layer hides N+1 queries behind lazy loads that
    # fire during serialisation, which is exactly the failure mode this system cannot afford.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        # TIME columns are wall-clock hours, not instants. Direct JDBC binding stops Hibernate
        # applying jdbc.time_zone to LocalTime (16:00–19:00 becoming 21:00–00:00 on UTC-5).
        type:
          java_time_use_direct_jdbc: true
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
        # Fail loudly in development rather than silently emitting N+1 selects.
        max_fetch_depth: 3

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  datasource:
    hikari:
      pool-name: lms-pool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1200000

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 12MB

  # Safe pagination defaults so no endpoint can be coerced into returning an unbounded result set.
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false

# Audience the resource server demands in every token. Spring Boot 3.3 has no standard property
# for this (`spring.security.oauth2.resourceserver.jwt.audiences` arrives in 3.4), so it lives in
# the application's own namespace. It is the Keycloak clientId of this API and does not vary by
# environment; the issuer and JWK set URI do, and are set per profile.
lms:
  storage:
    # "local" (LocalFilesystemBlobStore) is the default; a real deployment needs this to be durable,
    # shared storage, not a pod's local disk — set "minio" (self-hosted, dev/test) or "s3" (real AWS)
    # to register S3BlobStore instead. Adding a further remote provider (GCS, Azure Blob — see
    # StorageProvider) is a new document.storage.BlobStore bean selected by this property;
    # DocumentService does not change.
    provider: ${LMS_STORAGE_PROVIDER:local}
    local-root: ${LMS_STORAGE_ROOT:./data/blobs}
    max-upload-bytes: 12582912
  virus-scan:
    # Off by default: NoopVirusScanner reports every file NOT_SCANNED rather than faking a clean
    # bill. Set enabled=true with a reachable ClamAV daemon (host/port) to register
    # ClamAvVirusScanner instead — same DocumentService.store() call site either way.
    enabled: ${LMS_VIRUS_SCAN_ENABLED:false}
    host: ${LMS_VIRUS_SCAN_HOST:localhost}
    port: ${LMS_VIRUS_SCAN_PORT:3310}
  documents:
    retention:
      # How long a purgeable document's bytes are kept before DocumentRetentionSweeper deletes them.
      # COURSE_MATERIAL, ASSESSMENT_SUBMISSION, TRANSCRIPT and CERTIFICATE are academic-record
      # evidence and are never purged, regardless of these values — see
      # DocumentRetentionProperties.expiryFor.
      identification-days: ${LMS_DOCUMENT_RETENTION_IDENTIFICATION_DAYS:365}
      other-days: ${LMS_DOCUMENT_RETENTION_OTHER_DAYS:730}
  # Single-tenant white-label defaults. Admin overrides via PUT /api/v1/branding (System settings).
  # Keycloak's uniflow theme reads the same tokens at deploy time — see docker/keycloak/themes/uniflow.
  branding:
    product-name: ${LMS_PRODUCT_NAME:Uniflow Campus Portal}
    wordmark: ${LMS_WORDMARK:University Of Technology}
    institution-name: ${LMS_INSTITUTION_NAME:The University Of Technology}
    welcome-title: ${LMS_WELCOME_TITLE:Uniflow Campus Portal}
    welcome-subtitle: ${LMS_WELCOME_SUBTITLE:Welcome to the University Digital Campus Experience}
    student-cta-label: ${LMS_STUDENT_CTA:Students}
    staff-cta-label: ${LMS_STAFF_CTA:Staff & faculty}
    primary-color: ${LMS_PRIMARY_COLOR:#171717}
    accent-color: ${LMS_ACCENT_COLOR:#3b82f6}
    font-sans: ${LMS_FONT_SANS:Inter, ui-sans-serif, system-ui, sans-serif}
    font-display: ${LMS_FONT_DISPLAY:Inria Sans, Inter, ui-sans-serif, system-ui, sans-serif}
    logo-url: ${LMS_LOGO_URL:https://www.utech.edu.jm/assets/2023/12/UTech-Logo.webp}
    favicon-url: ${LMS_FAVICON_URL:https://yt3.googleusercontent.com/connko1b_He_JwFuBO0YniegoXaVMsp6-CB49umTDGsObP25qTa35tJumxdWBrhVIs4E_J58_pA=s900-c-k-c0x00ffffff-no-rj}
    support-email: ${LMS_SUPPORT_EMAIL:credeer0@gmail.com}
    contact-email: ${LMS_CONTACT_EMAIL:credeer0@gmail.com}
    phone-number: ${LMS_PHONE_NUMBER:+1(876)486-6195}
  notifications:
    sse:
      provider: local
      timeout-ms: 300000
    email:
      enabled: false
      provider: logging
      from-address: ${LMS_EMAIL_FROM:noreply@uniflow.local}
  finance:
    # The self-service payment endpoint posts a PAYMENT entry directly with no card network and no
    # payment gateway behind it — a "campus cashier stub" per FinanceService.payOwn's own javadoc.
    # Off by default so a real deployment cannot let a student clear their own balance for free;
    # flip on only where the stub itself is the accepted behaviour (local dev, a demo instance).
    self-service-payment:
      enabled: ${LMS_SELF_SERVICE_PAYMENT_ENABLED:false}
  outbox:
    poll-interval-ms: 2000
    batch-size: 25
  comms:
    rate-limit:
      message-send:
        limit: 30
        window-seconds: 60
      conversation-create:
        limit: 10
        window-seconds: 3600
      forum-post:
        limit: 20
        window-seconds: 3600
      forum-topic:
        limit: 10
        window-seconds: 3600
  security:
    jwt:
      audience: ${JWT_AUDIENCE:university-lms-api}

    # Where identity lives inside a token. Defaults are Keycloak's. They are configuration because
    # the identity provider is expected to change — a realm federated to Active Directory, LDAP or
    # another university's IdP may present the same facts under different names. Nothing outside
    # TokenClaimReader and the role converter may name a claim.
    claims:
      subject: ${JWT_CLAIM_SUBJECT:sub}
      username: ${JWT_CLAIM_USERNAME:preferred_username}
      email: ${JWT_CLAIM_EMAIL:email}
      email-verified: ${JWT_CLAIM_EMAIL_VERIFIED:email_verified}
      given-name: ${JWT_CLAIM_GIVEN_NAME:given_name}
      family-name: ${JWT_CLAIM_FAMILY_NAME:family_name}
      # The institutional student number, asserted by a Keycloak protocol mapper. Deliberately
      # distinct from `username`: a username can be renamed, and account correlation must never
      # follow a rename onto a different person's academic record.
      student-number: ${JWT_CLAIM_STUDENT_NUMBER:student_number}
      roles-path: ${JWT_CLAIM_ROLES_PATH:realm_access,roles}

  admissions:
    # How long a resume link stays usable. Bounds the damage of one that leaks — a link forwarded,
    # screenshotted or left in a shared browser stops working. Extended each time the applicant
    # legitimately resumes, so an active applicant is never cut off mid-application.
    access-token-ttl: ${ADMISSIONS_ACCESS_TOKEN_TTL:P30D}
    # Where the resume link points. Must be the public portal origin, not the API's.
    portal-base-url: ${ADMISSIONS_PORTAL_BASE_URL:http://localhost:5173}

  # HTTP-level rate limiting, applied before authentication. Keyed by client address, because the
  # callers this defends against have not identified themselves — the admissions endpoints are
  # reachable without a token. Per-user limits on authenticated actions are a separate layer and
  # live with the services that own them.
  #
  # Rules are evaluated in order and the first match wins, as with the authorization rules; a
  # request matching none is not limited here. Narrow rules must therefore come before broad ones.
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    max-tracked-clients: ${RATE_LIMIT_MAX_CLIENTS:100000}
    # CIDR ranges whose X-Forwarded-For may be believed. EMPTY BY DEFAULT — the header is
    # client-supplied, and trusting it unconditionally lets any caller bypass every limit below by
    # inventing an address per request. Set this to the load balancer's range on deployment.
    trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:}
    rules:
      # Resume sends an email to an address the caller names, so an open endpoint here is a way to
      # flood somebody else's inbox. Tighter than submit, and listed first because /resume also
      # matches the broader POST /applications/** rule below.
      - name: application-resume
        method: POST
        path: /api/v1/applications/resume
        limit: ${RATE_LIMIT_APPLICATION_RESUME:5}
        window: 1h
      # Unauthenticated writes are the sharpest edge: anyone on the internet can submit, and each
      # one costs a database transaction. Deliberately strict — a genuine applicant submits once.
      - name: application-submit
        method: POST
        path: /api/v1/applications/**
        limit: ${RATE_LIMIT_APPLICATION_SUBMIT:10}
        window: 1h
      - name: application-update
        method: PATCH
        path: /api/v1/applications/**
        limit: ${RATE_LIMIT_APPLICATION_UPDATE:60}
        window: 1h
      # Reading an application by id is unauthenticated, so the id is the only thing protecting it.
      # A tight limit is what makes guessing one infeasible rather than merely unlikely.
      - name: application-read
        method: GET
        path: /api/v1/applications/**
        limit: ${RATE_LIMIT_APPLICATION_READ:60}
        window: 1m
      # The public catalog the apply wizard reads. Generous: a single applicant legitimately makes
      # several of these while filling the form, and a stingy limit would break the page.
      - name: public-catalog
        method: GET
        path: /api/v1/programmes/**
        limit: ${RATE_LIMIT_PUBLIC_CATALOG:120}
        window: 1m
      - name: public-calendar
        method: GET
        path: /api/v1/academic-years/**
        limit: ${RATE_LIMIT_PUBLIC_CALENDAR:120}
        window: 1m
      # Backstop for everything else under the API. Wide enough that no legitimate signed-in session
      # notices, narrow enough that a single address cannot saturate the service.
      - name: api-overall
        method: ANY
        path: /api/v1/**
        limit: ${RATE_LIMIT_API_OVERALL:600}
        window: 1m

server:
  error:
    # Errors are rendered exclusively by GlobalExceptionHandler; the servlet container must never
    # leak an alternative representation containing internals.
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # Prometheus and the verbose metrics dump never ride on the public API port.
        include: health,info
  endpoint:
    health:
      show-details: never
  prometheus:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: 0.0
  otlp:
    metrics:
      export:
        enabled: false
  observations:
    key-values:
      service.namespace: uniflow

logging:
  pattern:
    # traceId ties every log line back to the X-Correlation-Id echoed to the client.
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
  level:
    com.university.lms: INFO
