# Configuration for the ArchUnit freezing mechanism used by ModuleBoundaryTest.
#
# The module-boundary rule was added after a substantial amount of code had already crossed it —
# see the comment on FROZEN_MODULES in ModuleBoundaryTest for the inventory. Freezing lets the rule
# be enforced from today onward without requiring that debt to be paid off in the same change that
# introduces the check: violations present when a module is first frozen continue to pass; any
# violation beyond that set fails the build.
#
# allowStoreUpdate=true: fixing a frozen violation shrinks the stored baseline on the next local
# test run, so the frozen set only ever shrinks as debt is paid off — nobody has to hand-edit the
# store to get credit for a cleanup.
# allowStoreCreation=true: convenience for a fresh checkout; irrelevant once the store below is
# committed, since ArchUnit only creates a store that does not yet exist.
freeze.store.default.path=src/test/resources/archunit_store
freeze.store.default.allowStoreUpdate=true
freeze.store.default.allowStoreCreation=true
