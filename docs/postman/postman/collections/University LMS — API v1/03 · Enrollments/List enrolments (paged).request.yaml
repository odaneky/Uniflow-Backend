$kind: http-request
description: Filter by student, section or status.
url: "{{baseUrl}}/api/v1/enrollments?page=0&size=20&studentId={{studentId}}"
method: GET
queryParams:
  - key: page
    value: "0"
  - key: size
    value: "20"
  - key: studentId
    value: "{{studentId}}"
  - key: courseSectionId
    value: "{{sectionId}}"
    disabled: true
  - key: status
    value: ENROLLED
    disabled: true
scripts:
  - type: afterResponse
    code: pm.test('200 OK', () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000
