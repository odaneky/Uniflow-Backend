$kind: http-request
description: enrolledCount should now be 1 and availableSeats one lower. This is the counter the guarded UPDATE maintains; a CHECK constraint keeps it inside 0..capacity regardless.
url: "{{baseUrl}}/api/v1/courses/{{courseId}}/sections"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const s = pm.response.json().find(x => x.id === pm.collectionVariables.get('sectionId'));
      pm.test('one seat taken', () => {
          pm.expect(s.enrolledCount).to.eql(1);
          pm.expect(s.availableSeats).to.eql(s.capacity - 1);
      });
    language: text/javascript
order: 3000
