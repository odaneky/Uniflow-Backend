$kind: http-request
description: Path variable that cannot be converted to a UUID. Handled as a type mismatch, not a 500.
url: "{{baseUrl}}/api/v1/students/not-a-uuid"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('400 Bad Request', () => pm.response.to.have.status(400));
      pm.test('VALIDATION_ERROR', () =>
          pm.expect(pm.response.json().code).to.eql('VALIDATION_ERROR'));
      const b = pm.response.json();
      pm.test('error envelope is the standard contract', () => {
          pm.expect(b).to.have.property('timestamp');
          pm.expect(b).to.have.property('status', pm.response.code);
          pm.expect(b).to.have.property('code');
          pm.expect(b).to.have.property('message');
          pm.expect(b).to.have.property('path');
          pm.expect(b).to.have.property('traceId');
      });
      pm.test('no internal detail leaks', () => {
          const raw = pm.response.text().toLowerCase();
          ['sqlexception','org.hibernate','org.springframework','select ','insert into','constraint ']
              .forEach(t => pm.expect(raw, 'leaked: ' + t).to.not.include(t));
      });
    language: text/javascript
order: 5000
