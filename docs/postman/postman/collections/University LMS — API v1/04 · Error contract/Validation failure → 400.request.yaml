$kind: http-request
description: Empty body. Returns 400 VALIDATION_ERROR with one entry per rejected field, including the rejected value — except where the field name looks like a secret, which is redacted.
url: "{{baseUrl}}/api/v1/courses"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('400 Bad Request', () => pm.response.to.have.status(400));
      const b = pm.response.json();
      pm.test('VALIDATION_ERROR with field detail', () => {
          pm.expect(b.code).to.eql('VALIDATION_ERROR');
          pm.expect(b.errors).to.be.an('array').that.is.not.empty;
          pm.expect(b.errors[0]).to.have.property('field');
          pm.expect(b.errors[0]).to.have.property('message');
      });
      const b = pm.response.json();
      pm.test('error envelope is the standard contract', () => {
          pm.expect(b).to.have.property('timestamp');
          pm.expect(b).to.have.property('status', pm.response.code);
          pm.expect(b).to.have.property('code');
          pm.expect(b).to.have.property('message');
          pm.expect(b).to.have.property('path');
          pm.expect(b).to.have.property('traceId');
      });
      pm.test('no internal detail leaks', () => {
          const raw = pm.response.text().toLowerCase();
          ['sqlexception','org.hibernate','org.springframework','select ','insert into','constraint ']
              .forEach(t => pm.expect(raw, 'leaked: ' + t).to.not.include(t));
      });
    language: text/javascript
order: 1000
