$kind: http-request
description: Paged and filterable. Both filters are optional and are applied in a single query rather than by a family of finder methods.
url: "{{baseUrl}}/api/v1/students?page=0&size=20&sort=studentNumber,asc"
method: GET
queryParams:
  - key: page
    value: "0"
  - key: size
    value: "20"
  - key: sort
    value: studentNumber,asc
  - key: status
    value: ACTIVE
    disabled: true
  - key: programmeId
    value: "{{programmeId}}"
    disabled: true
scripts:
  - type: afterResponse
    code: pm.test('200 OK', () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
