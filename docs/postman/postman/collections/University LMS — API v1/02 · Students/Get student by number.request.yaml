$kind: http-request
description: Lookup by matriculation number, the identifier staff actually use.
url: "{{baseUrl}}/api/v1/students/by-number/{{studentNumber}}"
method: GET
scripts:
  - type: afterResponse
    code: pm.test('200 OK', () => pm.response.to.have.status(200));
    language: text/javascript
order: 3000
